<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>
    STEAM4 QR Scanner
  </title>


  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        #f3f5f7;

      color:
        #111;

    }


    .app {

      max-width:
        520px;

      margin:
        auto;

      padding:
        16px;

    }


    .card {

      background:
        white;

      border-radius:
        22px;

      padding:
        20px;

      box-shadow:
        0 4px 20px
        rgba(0,0,0,.08);

    }


    h1 {

      margin:
        0 0 5px;

      font-size:
        24px;

    }


    .subtitle {

      color:
        #666;

      font-size:
        14px;

      line-height:
        1.5;

    }


    #reader {

      width:
        100%;

      margin-top:
        18px;

      overflow:
        hidden;

      border-radius:
        18px;

    }


    button {

      width:
        100%;

      min-height:
        50px;

      margin-top:
        12px;

      border:
        0;

      border-radius:
        14px;

      background:
        #111;

      color:
        white;

      font-size:
        16px;

      font-weight:
        700;

      cursor:
        pointer;

    }


    button.secondary {

      background:
        #ececec;

      color:
        #111;

    }


    button.warning {

      background:
        #995800;

      color:
        white;

    }


    button:disabled {

      opacity:
        .45;

    }


    .status {

      margin-top:
        16px;

      padding:
        18px;

      border-radius:
        16px;

      text-align:
        center;

      background:
        #f1f3f5;

    }


    .status.ready {

      background:
        #f1f3f5;

    }


    .status.success {

      background:
        #dcf7e2;

    }


    .status.warning {

      background:
        #fff0c5;

    }


    .status.error {

      background:
        #ffe0e0;

    }


    .status-title {

      font-size:
        23px;

      font-weight:
        800;

    }


    .status-name {

      margin-top:
        7px;

      font-size:
        19px;

      font-weight:
        700;

    }


    .status-detail {

      margin-top:
        5px;

      color:
        #555;

      font-size:
        13px;

      line-height:
        1.5;

    }


    .live {

      display:
        flex;

      align-items:
        center;

      gap:
        7px;

      margin-top:
        12px;

      padding:
        9px 12px;

      border-radius:
        999px;

      background:
        #eef7ef;

      font-size:
        12px;

      font-weight:
        700;

      width:
        fit-content;

    }


    .dot {

      width:
        9px;

      height:
        9px;

      border-radius:
        50%;

      background:
        #2f9e44;

    }


    .hidden {

      display:
        none !important;

    }


    .hint {

      margin-top:
        14px;

      padding:
        12px;

      border-radius:
        12px;

      background:
        #f7f7f7;

      color:
        #666;

      font-size:
        12px;

      line-height:
        1.5;

    }

  </style>

</head>


<body>


<div class="app">


  <div class="card">


    <h1>
      STEAM4 QR Scanner
    </h1>


    <div class="subtitle">

      Scanner Station —
      เปิดกล้องครั้งเดียวแล้วสแกนต่อเนื่องได้เลย

    </div>


    <div
      id="liveBadge"
      class="live hidden">

      <div class="dot"></div>

      CAMERA ACTIVE

    </div>


    <button
      id="startButton"
      onclick="startScanner()">

      📷 เริ่ม Scanner

    </button>


    <button
      id="stopButton"
      class="secondary hidden"
      onclick="stopScanner()">

      หยุดกล้อง

    </button>


    <div id="reader"></div>


    <div
      id="status"
      class="status ready">

      <div class="status-title">
        พร้อมใช้งาน
      </div>

      <div class="status-detail">
        กดเริ่ม Scanner เพียงครั้งเดียว
      </div>

    </div>


    <button
      id="walkinButton"
      class="warning hidden"
      onclick="confirmWalkIn()">

      อนุญาต Walk-in

    </button>


    <button
      class="secondary"
      onclick="closeScannerWindow()">

      ← กลับ Staff Dashboard

    </button>


    <div class="hint">

      หลังเปิดกล้องแล้ว
      ไม่ต้องกด Scan คนถัดไป
      เพียงนำ QR ของผู้เข้าร่วมคนต่อไปมาไว้หน้ากล้องได้ทันที

    </div>


  </div>


</div>


<!--
  Apps Script จะตอบกลับเข้ามาที่ iframe นี้

  หน้า Staff ไม่ถูก redirect
-->
<iframe
  id="bridgeFrame"
  name="bridgeFrame"
  style="display:none;">
</iframe>


<script>


/**
 * ============================================================
 * STATE
 * ============================================================
 */

let scanner =
  null;


let running =
  false;


let processing =
  false;


let pendingRequestId =
  '';


let pendingToken =
  '';


let pendingWalkInToken =
  '';


let lastToken =
  '';


let lastTokenAt =
  0;


/**
 * ============================================================
 * URL CONFIG
 * ============================================================
 */

const query =
  new URLSearchParams(
    window.location.search
  );


const callbackUrl =
  query.get(
    'callback'
  )
  ||
  '';


const scanSession =
  query.get(
    'session'
  )
  ||
  '';


/**
 * ต้องเปิดจาก Staff App เท่านั้น
 */
if (
  !callbackUrl ||
  !scanSession
) {

  setStatus(
    'error',
    'เปิด Scanner ไม่ถูกวิธี',
    '',
    'กรุณาเปิดจาก Staff Check-in Dashboard'
  );


  document
    .getElementById(
      'startButton'
    )
    .disabled =
      true;

}


/**
 * ============================================================
 * START CAMERA
 * ============================================================
 */
async function startScanner() {


  if (
    running
  ) {
    return;
  }


  if (
    !callbackUrl ||
    !scanSession
  ) {
    return;
  }


  try {


    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(


      {
        facingMode:
          'environment'
      },


      {
        fps:
          12,

        qrbox: {
          width:
            260,
          height:
            260
        },

        aspectRatio:
          1

      },


      function(
        decodedText
      ) {

        onQrDetected(
          decodedText
        );

      },


      function() {

        // ignore QR miss

      }


    );


    running =
      true;


    document
      .getElementById(
        'startButton'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'stopButton'
      )
      .classList
      .remove(
        'hidden'
      );


    document
      .getElementById(
        'liveBadge'
      )
      .classList
      .remove(
        'hidden'
      );


    setStatus(
      'ready',
      'พร้อมสแกน',
      '',
      'นำ QR Code มาไว้หน้ากล้อง'
    );


  } catch (error) {


    console.error(
      error
    );


    setStatus(
      'error',
      'เปิดกล้องไม่ได้',
      '',
      error.message ||
      String(error)
    );


  }

}


/**
 * ============================================================
 * QR DETECTED
 * ============================================================
 */
function onQrDetected(
  decodedText
) {


  if (
    processing
  ) {
    return;
  }


  const token =
    String(
      decodedText || ''
    )
    .trim();


  if (!token) {
    return;
  }


  const now =
    Date.now();


  /**
   * กัน QR เดิมยิงซ้ำทันที
   *
   * QR คนใหม่ยังสแกนได้ทันที
   */
  if (
    token ===
      lastToken
    &&
    now -
      lastTokenAt
    <
    8000
  ) {

    return;
  }


  lastToken =
    token;


  lastTokenAt =
    now;


  submitScan(
    token,
    false
  );

}


/**
 * ============================================================
 * SUBMIT SCAN
 * ============================================================
 */
function submitScan(
  token,
  overrideWalkin
) {


  if (
    processing
  ) {
    return;
  }


  processing =
    true;


  pendingWalkInToken =
    '';


  document
    .getElementById(
      'walkinButton'
    )
    .classList
    .add(
      'hidden'
    );


  setStatus(
    'ready',
    'กำลังตรวจสอบ...',
    '',
    'กรุณารอสักครู่'
  );


  const requestId =
    createRequestId();


  pendingRequestId =
    requestId;


  pendingToken =
    token;


  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';


  form.action =
    callbackUrl;


  /**
   * สำคัญ
   *
   * ส่งเข้า iframe
   * ไม่เปลี่ยนหน้า Scanner
   */
  form.target =
    'bridgeFrame';


  appendHidden(
    form,
    'action',
    'externalScanV2'
  );


  appendHidden(
    form,
    'scanSession',
    scanSession
  );


  appendHidden(
    form,
    'requestId',
    requestId
  );


  appendHidden(
    form,
    'token',
    token
  );


  appendHidden(
    form,
    'overrideWalkin',
    overrideWalkin
      ?
      '1'
      :
      '0'
  );


  document
    .body
    .appendChild(
      form
    );


  form.submit();


  /**
   * form ใช้เสร็จแล้ว
   */
  setTimeout(
    function() {

      try {
        form.remove();
      } catch (error) {}

    },
    1000
  );


  /**
   * Timeout safety
   */
  setTimeout(
    function() {

      if (
        processing &&
        pendingRequestId ===
          requestId
      ) {

        processing =
          false;


        setStatus(
          'error',
          'ระบบตอบกลับช้า',
          '',
          'ลองสแกน QR อีกครั้ง'
        );

      }

    },
    15000
  );

}


/**
 * ============================================================
 * RECEIVE RESULT FROM APPS SCRIPT
 * ============================================================
 */
window.addEventListener(
  'message',

  function(event) {


    const data =
      event.data;


    if (
      !data ||
      data.source !==
        'STEAM4_SCAN_RESULT'
    ) {

      return;
    }


    /**
     * ป้องกัน response เก่า
     */
    if (
      !data.requestId ||
      data.requestId !==
        pendingRequestId
    ) {

      return;
    }


    processing =
      false;


    pendingRequestId =
      '';


    handleResult(
      data.result || {}
    );

  }
);


/**
 * ============================================================
 * RESULT
 * ============================================================
 */
function handleResult(
  result
) {


  /**
   * SUCCESS
   */
  if (
    result.ok
  ) {


    const title =
      result.type ===
      'WALK_IN'
        ?
        '✅ WALK-IN'
        :
        '✅ SUCCESS';


    let detail =
      result.registrationId ||
      '';


    if (
      result.sessionName
    ) {

      detail +=
        (
          detail
            ?
            ' · '
            :
            ''
        )
        +
        result.sessionName;

    }


    setStatus(
      'success',
      title,
      result.name || '',
      detail
    );


    /**
     * Camera ยังเปิดอยู่
     *
     * คนต่อไปเอา QR เข้ามาได้เลย
     */


    return;
  }


  /**
   * DUPLICATE
   */
  if (
    result.type ===
    'DUPLICATE'
  ) {


    setStatus(
      'warning',
      '⚠️ ALREADY CHECKED-IN',
      result.name || '',
      result.message || ''
    );


    return;
  }


  /**
   * NOT REGISTERED
   */
  if (
    result.type ===
    'NOT_REGISTERED'
  ) {


    pendingWalkInToken =
      pendingToken;


    setStatus(
      'warning',
      '⚠️ NOT REGISTERED',
      result.name || '',
      result.sessionName ||
      result.message ||
      ''
    );


    if (
      result.canOverride
    ) {

      document
        .getElementById(
          'walkinButton'
        )
        .classList
        .remove(
          'hidden'
        );

    }


    return;
  }


  /**
   * SESSION FULL
   */
  if (
    result.type ===
    'SESSION_FULL'
  ) {


    setStatus(
      'error',
      '🔴 ROOM FULL',
      result.name || '',
      result.message || ''
    );


    return;
  }


  /**
   * Scanner session expired
   */
  if (
    result.type ===
    'SCAN_SESSION_EXPIRED'
  ) {


    setStatus(
      'error',
      'Scanner Session หมดอายุ',
      '',
      'กลับ Staff Dashboard แล้วเปิด Scanner ใหม่'
    );


    return;
  }


  /**
   * Generic error
   */
  setStatus(
    'error',
    '❌ ERROR',
    result.name || '',
    result.message ||
    result.type ||
    'เกิดข้อผิดพลาด'
  );

}


/**
 * ============================================================
 * WALK-IN
 * ============================================================
 */
function confirmWalkIn() {


  if (
    !pendingWalkInToken
  ) {
    return;
  }


  const token =
    pendingWalkInToken;


  pendingWalkInToken =
    '';


  document
    .getElementById(
      'walkinButton'
    )
    .classList
    .add(
      'hidden'
    );


  /**
   * อนุญาตให้ QR เดิม submit ได้
   */
  processing =
    false;


  submitScan(
    token,
    true
  );

}


/**
 * ============================================================
 * STOP CAMERA
 * ============================================================
 */
async function stopScanner() {


  if (
    !scanner ||
    !running
  ) {
    return;
  }


  try {

    await scanner.stop();

  } catch (error) {

    console.log(
      error
    );

  }


  running =
    false;


  document
    .getElementById(
      'liveBadge'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'stopButton'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'startButton'
    )
    .classList
    .remove(
      'hidden'
    );


  setStatus(
    'ready',
    'กล้องหยุดแล้ว',
    '',
    'กดเริ่ม Scanner เพื่อใช้งานต่อ'
  );

}


/**
 * ============================================================
 * BACK TO DASHBOARD
 * ============================================================
 */
async function closeScannerWindow() {


  if (
    running
  ) {

    try {

      await scanner.stop();

    } catch (error) {}

  }


  /**
   * เราไม่ redirect ไป /exec
   *
   * เพราะหน้า Dashboard เดิม
   * ยังเปิดและ Login อยู่ด้านหลัง
   */
  try {

    window.close();

  } catch (error) {}


  /**
   * iPhone บางกรณีไม่ยอมให้ JS ปิด
   */
  setTimeout(
    function() {

      setStatus(
        'ready',
        'กลับ Staff Dashboard',
        '',
        'หากหน้านี้ไม่ปิดอัตโนมัติ ให้กด X มุมขวาบน'
      );

    },
    400
  );

}


/**
 * ============================================================
 * HELPERS
 * ============================================================
 */

function appendHidden(
  form,
  name,
  value
) {


  const input =
    document.createElement(
      'input'
    );


  input.type =
    'hidden';


  input.name =
    name;


  input.value =
    value;


  form.appendChild(
    input
  );

}


function createRequestId() {


  if (
    window.crypto &&
    typeof window.crypto.randomUUID ===
      'function'
  ) {

    return window.crypto
      .randomUUID();

  }


  return (
    Date.now()
    +
    '-'
    +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function setStatus(
  type,
  title,
  name,
  detail
) {


  const box =
    document
      .getElementById(
        'status'
      );


  box.className =
    'status '
    +
    type;


  box.innerHTML =
    `

      <div class="status-title">
        ${escapeHtml(title)}
      </div>

      ${
        name
          ?
          `
            <div class="status-name">
              ${escapeHtml(name)}
            </div>
          `
          :
          ''
      }

      ${
        detail
          ?
          `
            <div class="status-detail">
              ${escapeHtml(detail)}
            </div>
          `
          :
          ''
      }

    `;

}


function escapeHtml(
  text
) {


  const div =
    document.createElement(
      'div'
    );


  div.textContent =
    text || '';


  return div.innerHTML;

}


</script>


</body>

</html>
