<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>
    STEAM4 QR Scanner
  </title>


  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        #f4f5f7;

      color:
        #111;

    }


    .app {

      width:
        100%;

      max-width:
        520px;

      margin:
        auto;

      padding:
        16px;

    }


    .card {

      background:
        white;

      border-radius:
        22px;

      padding:
        20px;

      margin-bottom:
        14px;

    }


    h1 {

      margin:
        0;

      font-size:
        25px;

    }


    .subtitle {

      margin-top:
        5px;

      color:
        #6b7280;

      font-size:
        14px;

      line-height:
        1.5;

    }


    .hidden {

      display:
        none !important;

    }


    /**
     * ========================================================
     * SESSION HEADER
     * ========================================================
     */

    .session-name {

      font-size:
        22px;

      line-height:
        1.3;

      font-weight:
        800;

    }


    .session-meta {

      margin-top:
        6px;

      color:
        #666;

      font-size:
        13px;

    }


    .room {

      display:
        inline-block;

      margin-top:
        10px;

      padding:
        7px 10px;

      border-radius:
        999px;

      background:
        #f0f1f3;

      font-size:
        12px;

      font-weight:
        750;

    }


    /**
     * ========================================================
     * CAPACITY
     * ========================================================
     */

    .capacity-main {

      margin-top:
        20px;

      text-align:
        center;

    }


    .capacity-number {

      font-size:
        44px;

      line-height:
        1;

      font-weight:
        850;

    }


    .capacity-remaining {

      margin-top:
        7px;

      color:
        #666;

      font-size:
        14px;

    }


    .progress {

      width:
        100%;

      height:
        11px;

      margin-top:
        16px;

      border-radius:
        999px;

      overflow:
        hidden;

      background:
        #ececec;

    }


    .progress-fill {

      height:
        100%;

      width:
        0%;

      border-radius:
        inherit;

      background:
        #111;

      transition:
        width .25s ease;

    }


    .stats {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        8px;

      margin-top:
        16px;

    }


    .stat {

      padding:
        12px 5px;

      border-radius:
        13px;

      background:
        #f5f6f7;

      text-align:
        center;

    }


    .stat-value {

      font-size:
        22px;

      font-weight:
        800;

    }


    .stat-label {

      margin-top:
        3px;

      color:
        #6b7280;

      font-size:
        10px;

    }


    .status-pill {

      width:
        fit-content;

      margin:
        14px auto 0;

      padding:
        7px 11px;

      border-radius:
        999px;

      font-size:
        12px;

      font-weight:
        800;

    }


    .status-open {

      background:
        #dcf7e2;

    }


    .status-busy {

      background:
        #fff0c5;

    }


    .status-full {

      background:
        #ffdada;

    }


    /**
     * ========================================================
     * CAMERA
     * ========================================================
     */

    #reader {

      width:
        100%;

      margin-top:
        15px;

      overflow:
        hidden;

      border-radius:
        18px;

    }


    .camera-badge {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        7px;

      margin-top:
        12px;

      padding:
        7px 10px;

      border-radius:
        999px;

      background:
        #e8f7eb;

      font-size:
        11px;

      font-weight:
        800;

    }


    .dot {

      width:
        8px;

      height:
        8px;

      border-radius:
        50%;

      background:
        #2f9e44;

    }


    /**
     * ========================================================
     * RESULT
     * ========================================================
     */

    .result {

      padding:
        24px 15px;

      border-radius:
        18px;

      text-align:
        center;

      background:
        #f1f3f5;

    }


    .result.loading {

      background:
        #eef1f4;

    }


    .result.success {

      background:
        #dcf7e2;

    }


    .result.warning {

      background:
        #fff0c5;

    }


    .result.error {

      background:
        #ffdede;

    }


    .result-title {

      font-size:
        25px;

      font-weight:
        850;

    }


    .result-name {

      margin-top:
        8px;

      font-size:
        21px;

      font-weight:
        750;

    }


    .result-detail {

      margin-top:
        6px;

      color:
        #555;

      font-size:
        13px;

      line-height:
        1.5;

    }


    /**
     * ========================================================
     * BUTTON
     * ========================================================
     */

    button {

      width:
        100%;

      min-height:
        52px;

      margin-top:
        12px;

      padding:
        12px;

      border:
        0;

      border-radius:
        14px;

      background:
        #111;

      color:
        white;

      font-size:
        17px;

      font-weight:
        750;

    }


    button.secondary {

      background:
        #ededed;

      color:
        #111;

    }


    button.warning {

      background:
        #995900;

    }


    button:disabled {

      opacity:
        .45;

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ======================================================
       HEADER
  ======================================================= -->

  <div class="card">

    <h1>
      STEAM4 QR Scanner
    </h1>


    <div
      id="mainEntranceTitle"
      class="subtitle hidden">
      Main Entrance
    </div>


    <div
      id="sessionHeader"
      class="hidden">

      <div
        id="sessionName"
        class="session-name">
      </div>


      <div
        id="sessionMeta"
        class="session-meta">
      </div>


      <div
        id="room"
        class="room">
      </div>

    </div>

  </div>


  <!-- ======================================================
       SESSION CAPACITY DASHBOARD
  ======================================================= -->

  <div
    id="sessionStatsCard"
    class="card hidden">


    <div class="capacity-main">


      <div
        id="capacityNumber"
        class="capacity-number">
        -
      </div>


      <div
        id="capacityRemaining"
        class="capacity-remaining">
        กำลังโหลด...
      </div>


    </div>


    <div class="progress">

      <div
        id="progressFill"
        class="progress-fill">
      </div>

    </div>


    <div class="stats">


      <div class="stat">

        <div
          id="registeredCount"
          class="stat-value">
          -
        </div>

        <div class="stat-label">
          REGISTERED
        </div>

      </div>


      <div class="stat">

        <div
          id="checkedInCount"
          class="stat-value">
          -
        </div>

        <div class="stat-label">
          CHECKED-IN
        </div>

      </div>


      <div class="stat">

        <div
          id="walkInCount"
          class="stat-value">
          -
        </div>

        <div class="stat-label">
          WALK-IN
        </div>

      </div>


    </div>


    <div
      id="occupancyStatus"
      class="status-pill status-open">
      🟢 OPEN
    </div>


  </div>


  <!-- ======================================================
       CAMERA
  ======================================================= -->

  <div class="card">


    <button
      id="startButton"
      onclick="startScanner()">
      📷 เริ่ม QR Scanner
    </button>


    <button
      id="stopButton"
      class="secondary hidden"
      onclick="stopScanner()">
      หยุดกล้อง
    </button>


    <div
      id="cameraBadge"
      class="camera-badge hidden">

      <div class="dot"></div>

      CAMERA ACTIVE

    </div>


    <div id="reader"></div>


  </div>


  <!-- ======================================================
       RESULT
  ======================================================= -->

  <div class="card">


    <div
      id="result"
      class="result">

      <div class="result-title">
        พร้อมใช้งาน
      </div>

      <div class="result-detail">
        กดเริ่ม QR Scanner
      </div>

    </div>


    <button
      id="nextButton"
      class="hidden"
      onclick="scanNextPerson()">
      📷 Scan คนต่อไป
    </button>


    <button
      id="walkinButton"
      class="warning hidden"
      onclick="confirmWalkIn()">
      อนุญาต Walk-in
    </button>


    <button
      class="secondary"
      onclick="closeScannerWindow()">
      ← กลับ Staff Dashboard
    </button>


  </div>


</div>


<iframe
  id="bridgeFrame"
  name="bridgeFrame"
  style="display:none;">
</iframe>


<script>

/**
 * ============================================================
 * URL
 * ============================================================
 */

const params =
  new URLSearchParams(
    window.location.search
  );


const callbackUrl =
  params.get('callback') || '';


const scanSession =
  params.get('session') || '';


const scannerMode =
  params.get('mode') || 'EVENT';


const sessionId =
  params.get('sessionId') || '';


const sessionName =
  params.get('sessionName') || '';


const room =
  params.get('room') || '';


const sessionDate =
  params.get('date') || '';


const sessionTime =
  params.get('time') || '';


const gate =
  params.get('gate') || '';


/**
 * ============================================================
 * STATE
 * ============================================================
 */

let scanner =
  null;


let running =
  false;


let paused =
  false;


let processing =
  false;


let pendingRequestId =
  '';


let pendingToken =
  '';


let pendingWalkInToken =
  '';


let statsRequestId =
  '';


let timeoutId =
  null;


/**
 * ============================================================
 * INITIAL UI
 * ============================================================
 */

if (
  scannerMode ===
  'SESSION'
) {

  document
    .getElementById(
      'sessionHeader'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'sessionStatsCard'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'sessionName'
    )
    .textContent =
      sessionName
      ||
      sessionId;


  document
    .getElementById(
      'sessionMeta'
    )
    .textContent =
      [
        sessionDate,
        sessionTime
      ]
      .filter(Boolean)
      .join(
        ' · '
      );


  document
    .getElementById(
      'room'
    )
    .textContent =
      room
      ||
      'ยังไม่ได้ระบุห้อง';


  /**
   * โหลดจำนวนคนทันที
   */
  requestSessionStats();

} else {

  document
    .getElementById(
      'mainEntranceTitle'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'mainEntranceTitle'
    )
    .textContent =
      'Main Entrance · '
      +
      gate;

}


/**
 * ============================================================
 * START CAMERA
 * ============================================================
 */

async function startScanner() {

  if (
    running
  ) {
    return;
  }


  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      {
        facingMode:
          'environment'
      },

      {
        fps:
          15,

        qrbox: {
          width:
            260,
          height:
            260
        },

        aspectRatio:
          1
      },

      function(decodedText) {

        onQrDetected(
          decodedText
        );

      },

      function() {}

    );


    running =
      true;


    paused =
      false;


    document
      .getElementById(
        'startButton'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'stopButton'
      )
      .classList
      .remove(
        'hidden'
      );


    document
      .getElementById(
        'cameraBadge'
      )
      .classList
      .remove(
        'hidden'
      );


    setResult(
      '',
      'พร้อมสแกน',
      '',
      'นำ QR Code มาไว้หน้ากล้อง'
    );


  } catch (error) {

    setResult(
      'error',
      'เปิดกล้องไม่ได้',
      '',
      error.message ||
      String(error)
    );

  }

}


/**
 * ============================================================
 * QR DETECTED
 * ============================================================
 */

function onQrDetected(
  decodedText
) {

  if (
    processing ||
    paused
  ) {
    return;
  }


  const token =
    String(
      decodedText || ''
    ).trim();


  if (!token) {
    return;
  }


  /**
   * Pause แต่ไม่ Stop
   */
  pauseCamera();


  /**
   * ให้ Staff รู้ทันทีว่า
   * QR ถูกอ่านแล้ว
   *
   * ช่วยลด perception ว่าระบบช้า
   */
  setResult(
    'loading',
    '✓ อ่าน QR แล้ว',
    '',
    'กำลังตรวจสอบข้อมูล...'
  );


  submitScan(
    token,
    false
  );

}


/**
 * ============================================================
 * CAMERA PAUSE / RESUME
 * ============================================================
 */

function pauseCamera() {

  if (
    !scanner ||
    !running ||
    paused
  ) {
    return;
  }


  try {

    if (
      typeof scanner.pause ===
      'function'
    ) {

      scanner.pause(
        true
      );

    }

  } catch (error) {}


  paused =
    true;

}


function resumeCamera() {

  if (
    !scanner ||
    !running
  ) {
    return;
  }


  try {

    if (
      typeof scanner.resume ===
      'function'
    ) {

      scanner.resume();

    }

  } catch (error) {}


  paused =
    false;

}


/**
 * ============================================================
 * SUBMIT SCAN
 * ============================================================
 */

function submitScan(
  token,
  overrideWalkin
) {

  if (
    processing
  ) {
    return;
  }


  processing =
    true;


  pendingToken =
    token;


  pendingWalkInToken =
    '';


  hideActionButtons();


  const requestId =
    createRequestId();


  pendingRequestId =
    requestId;


  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';


  form.action =
    callbackUrl;


  form.target =
    'bridgeFrame';


  appendHidden(
    form,
    'action',
    'externalScanV2'
  );


  appendHidden(
    form,
    'scanSession',
    scanSession
  );


  appendHidden(
    form,
    'requestId',
    requestId
  );


  appendHidden(
    form,
    'token',
    token
  );


  appendHidden(
    form,
    'overrideWalkin',
    overrideWalkin
      ?
      '1'
      :
      '0'
  );


  document
    .body
    .appendChild(
      form
    );


  form.submit();


  setTimeout(
    function() {

      try {
        form.remove();
      } catch (error) {}

    },
    1000
  );


  clearTimeout(
    timeoutId
  );


  timeoutId =
    setTimeout(
      function() {

        if (
          processing &&
          pendingRequestId ===
            requestId
        ) {

          processing =
            false;


          pendingRequestId =
            '';


          setResult(
            'error',
            'ระบบตอบกลับช้า',
            '',
            'ลอง Scan คนนี้อีกครั้ง'
          );


          showNextButton();

        }

      },
      12000
    );

}


/**
 * ============================================================
 * RECEIVE RESPONSE
 * ============================================================
 */

window.addEventListener(
  'message',

  function(event) {

    const data =
      event.data;


    if (!data) {
      return;
    }


    /**
     * Scan result
     */
    if (
      data.source ===
      'STEAM4_SCAN_RESULT'
    ) {

      if (
        data.requestId !==
        pendingRequestId
      ) {
        return;
      }


      clearTimeout(
        timeoutId
      );


      processing =
        false;


      pendingRequestId =
        '';


      handleScanResult(
        data.result || {}
      );


      return;
    }


    /**
     * Session stats
     */
    if (
      data.source ===
      'STEAM4_SESSION_STATS'
    ) {

      if (
        data.requestId !==
        statsRequestId
      ) {
        return;
      }


      if (
        data.stats &&
        data.stats.ok
      ) {

        renderSessionStats(
          data.stats
        );

      }

    }

  }
);


/**
 * ============================================================
 * SCAN RESULT
 * ============================================================
 */

function handleScanResult(
  result
) {

  /**
   * ตัวเลข Session
   * มากับ Scan response แล้ว
   *
   * ไม่ต้อง query Backend รอบสอง
   */
  if (
    result.sessionStats &&
    result.sessionStats.ok
  ) {

    renderSessionStats(
      result.sessionStats
    );

  }


  if (
    result.ok
  ) {

    let detail =
      result.registrationId
      ||
      '';


    if (
      result.sessionName
    ) {

      detail +=
        (
          detail
            ?
            ' · '
            :
            ''
        )
        +
        result.sessionName;

    }


    setResult(

      'success',

      result.type ===
      'WALK_IN'
        ?
        '✅ WALK-IN SUCCESS'
        :
        '✅ CHECK-IN SUCCESS',

      result.name ||
      '',

      detail

    );


    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        100
      );

    }


    showNextButton();


    return;
  }


  if (
    result.type ===
    'DUPLICATE'
  ) {

    setResult(
      'warning',
      '⚠️ CHECKED-IN แล้ว',
      result.name || '',
      result.message || ''
    );


    showNextButton();


    return;
  }


  if (
    result.type ===
    'NOT_REGISTERED'
  ) {

    pendingWalkInToken =
      pendingToken;


    setResult(
      'warning',
      '⚠️ ไม่ได้ลงทะเบียน Session นี้',
      result.name || '',
      result.sessionName ||
      result.message ||
      ''
    );


    if (
      result.canOverride
    ) {

      document
        .getElementById(
          'walkinButton'
        )
        .classList
        .remove(
          'hidden'
        );

    }


    showNextButton();


    return;
  }


  if (
    result.type ===
    'SESSION_FULL'
  ) {

    setResult(
      'error',
      '🔴 ห้องเต็ม',
      result.name || '',
      result.message || ''
    );


    showNextButton();


    return;
  }


  if (
    result.type ===
    'SCAN_SESSION_EXPIRED'
  ) {

    setResult(
      'error',
      'Scanner Session หมดอายุ',
      '',
      'กลับ Staff Dashboard แล้วเปิด Scanner ใหม่'
    );


    return;
  }


  setResult(
    'error',
    '❌ ERROR',
    result.name || '',
    result.message ||
    result.type ||
    'เกิดข้อผิดพลาด'
  );


  showNextButton();

}


/**
 * ============================================================
 * SESSION STATS
 * ============================================================
 */

function requestSessionStats() {

  if (
    scannerMode !==
    'SESSION'
  ) {
    return;
  }


  statsRequestId =
    createRequestId();


  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';


  form.action =
    callbackUrl;


  form.target =
    'bridgeFrame';


  appendHidden(
    form,
    'action',
    'externalSessionStats'
  );


  appendHidden(
    form,
    'scanSession',
    scanSession
  );


  appendHidden(
    form,
    'requestId',
    statsRequestId
  );


  document
    .body
    .appendChild(
      form
    );


  form.submit();


  setTimeout(
    function() {

      try {
        form.remove();
      } catch (error) {}

    },
    1000
  );

}


function renderSessionStats(
  stats
) {

  const capacity =
    stats.session &&
    stats.session.capacity
      ?
      Number(
        stats.session.capacity
      )
      :
      null;


  const total =
    Number(
      stats.totalCheckedIn
      ||
      0
    );


  /**
   * Big number
   */
  document
    .getElementById(
      'capacityNumber'
    )
    .textContent =
      capacity
        ?
        total
        +
        ' / '
        +
        capacity
        :
        total;


  /**
   * Remaining
   */
  document
    .getElementById(
      'capacityRemaining'
    )
    .textContent =
      capacity
        ?
        'เหลือ '
        +
        stats.remaining
        +
        ' ที่'
        :
        'Check-in แล้ว';


  /**
   * Counters
   */
  document
    .getElementById(
      'registeredCount'
    )
    .textContent =
      stats.registered;


  document
    .getElementById(
      'checkedInCount'
    )
    .textContent =
      stats.checkedInRegistered;


  document
    .getElementById(
      'walkInCount'
    )
    .textContent =
      stats.walkIn;


  /**
   * Progress
   */
  const percentage =
    stats.percentage ===
      null
      ?
      0
      :
      Math.min(
        Number(
          stats.percentage
        ),
        100
      );


  document
    .getElementById(
      'progressFill'
    )
    .style
    .width =
      percentage
      +
      '%';


  /**
   * Status
   */
  const pill =
    document
      .getElementById(
        'occupancyStatus'
      );


  pill.className =
    'status-pill';


  if (
    stats.occupancyStatus ===
    'FULL'
  ) {

    pill.textContent =
      '🔴 FULL';


    pill.classList
      .add(
        'status-full'
      );

  } else if (
    stats.occupancyStatus ===
      'BUSY'
    ||
    stats.occupancyStatus ===
      'NEARLY_FULL'
  ) {

    pill.textContent =
      stats.occupancyStatus ===
      'NEARLY_FULL'
        ?
        '🟡 NEARLY FULL'
        :
        '🟡 BUSY';


    pill.classList
      .add(
        'status-busy'
      );

  } else {

    pill.textContent =
      '🟢 OPEN';


    pill.classList
      .add(
        'status-open'
      );

  }

}


/**
 * ============================================================
 * NEXT PERSON
 * ============================================================
 */

function scanNextPerson() {

  hideActionButtons();


  pendingToken =
    '';


  pendingWalkInToken =
    '';


  processing =
    false;


  resumeCamera();


  setResult(
    '',
    'พร้อมสแกนคนต่อไป',
    '',
    'นำ QR Code มาไว้หน้ากล้อง'
  );

}


/**
 * ============================================================
 * WALK-IN
 * ============================================================
 */

function confirmWalkIn() {

  if (
    !pendingWalkInToken
  ) {
    return;
  }


  const token =
    pendingWalkInToken;


  processing =
    false;


  hideActionButtons();


  setResult(
    'loading',
    'กำลังอนุมัติ Walk-in...',
    '',
    ''
  );


  submitScan(
    token,
    true
  );

}


/**
 * ============================================================
 * STOP
 * ============================================================
 */

async function stopScanner() {

  if (
    !scanner ||
    !running
  ) {
    return;
  }


  try {

    await scanner.stop();

  } catch (error) {}


  running =
    false;


  paused =
    false;


  processing =
    false;


  document
    .getElementById(
      'cameraBadge'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'stopButton'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'startButton'
    )
    .classList
    .remove(
      'hidden'
    );

}


/**
 * ============================================================
 * CLOSE
 * ============================================================
 */

async function closeScannerWindow() {

  if (
    scanner &&
    running
  ) {

    try {
      await scanner.stop();
    } catch (error) {}

  }


  try {

    window.close();

  } catch (error) {}


  setTimeout(
    function() {

      setResult(
        '',
        'กลับ Staff Dashboard',
        '',
        'กด X มุมขวาบนหากหน้านี้ไม่ปิดอัตโนมัติ'
      );

    },
    400
  );

}


/**
 * ============================================================
 * UI
 * ============================================================
 */

function setResult(
  type,
  title,
  name,
  detail
) {

  const box =
    document
      .getElementById(
        'result'
      );


  box.className =
    'result'
    +
    (
      type
        ?
        ' ' +
        type
        :
        ''
    );


  box.innerHTML =
    `

      <div class="result-title">
        ${escapeHtml(title)}
      </div>

      ${
        name
          ?
          `
            <div class="result-name">
              ${escapeHtml(name)}
            </div>
          `
          :
          ''
      }

      ${
        detail
          ?
          `
            <div class="result-detail">
              ${escapeHtml(detail)}
            </div>
          `
          :
          ''
      }

    `;

}


function hideActionButtons() {

  document
    .getElementById(
      'nextButton'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'walkinButton'
    )
    .classList
    .add(
      'hidden'
    );

}


function showNextButton() {

  document
    .getElementById(
      'nextButton'
    )
    .classList
    .remove(
      'hidden'
    );

}


/**
 * ============================================================
 * HELPERS
 * ============================================================
 */

function appendHidden(
  form,
  name,
  value
) {

  const input =
    document
      .createElement(
        'input'
      );


  input.type =
    'hidden';


  input.name =
    name;


  input.value =
    value;


  form.appendChild(
    input
  );

}


function createRequestId() {

  if (
    window.crypto &&
    typeof window.crypto.randomUUID ===
      'function'
  ) {

    return window.crypto
      .randomUUID();

  }


  return (
    Date.now()
    +
    '-'
    +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function escapeHtml(
  text
) {

  const div =
    document
      .createElement(
        'div'
      );


  div.textContent =
    text || '';


  return div.innerHTML;

}

</script>
