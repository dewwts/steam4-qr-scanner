<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>
    STEAM4 QR Scanner
  </title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f3f5f7;
      color: #111;
    }

    .app {
      max-width: 520px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;

      border-radius: 22px;

      padding: 22px;

      box-shadow:
        0 4px 20px
        rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    #reader {
      width: 100%;

      margin-top: 18px;

      overflow: hidden;

      border-radius: 18px;
    }

    button {
      width: 100%;
      min-height: 52px;

      margin-top: 12px;

      border: 0;

      border-radius: 14px;

      background: #111;

      color: #fff;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;
    }

    button.secondary {
      background: #ececec;
      color: #111;
    }

    button.warning {
      background: #a05b00;
      color: white;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    .hidden {
      display: none !important;
    }

    .camera-badge {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      margin-top: 14px;

      padding: 8px 11px;

      border-radius: 999px;

      background: #e7f7ea;

      font-size: 12px;

      font-weight: 750;
    }

    .dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #2f9e44;
    }

    .result {
      margin-top: 18px;

      padding: 24px 16px;

      border-radius: 18px;

      text-align: center;

      background: #f1f3f5;
    }

    .result.ready {
      background: #f1f3f5;
    }

    .result.loading {
      background: #eef1f4;
    }

    .result.success {
      background: #dcf7e2;
    }

    .result.warning {
      background: #fff0c5;
    }

    .result.error {
      background: #ffe0e0;
    }

    .result-title {
      font-size: 25px;
      font-weight: 800;
    }

    .result-name {
      margin-top: 9px;

      font-size: 21px;

      font-weight: 700;
    }

    .result-detail {
      margin-top: 6px;

      color: #555;

      font-size: 14px;

      line-height: 1.5;
    }

    .hint {
      margin-top: 16px;

      padding: 13px;

      border-radius: 12px;

      background: #f7f7f7;

      color: #666;

      font-size: 12px;

      line-height: 1.55;
    }

  </style>

</head>


<body>


<div class="app">


  <div class="card">


    <h1>
      STEAM4 QR Scanner
    </h1>


    <div class="subtitle">
      เปิดกล้องครั้งเดียว แล้วใช้สำหรับ Check-in
      ผู้เข้าร่วมต่อเนื่องได้เลย
    </div>


    <div
      id="cameraBadge"
      class="camera-badge hidden">

      <div class="dot"></div>

      CAMERA ACTIVE

    </div>


    <!--
      กดครั้งเดียวตอนเริ่ม Station
    -->
    <button
      id="startButton"
      onclick="startScanner()">

      📷 เริ่ม QR Scanner

    </button>


    <button
      id="stopButton"
      class="secondary hidden"
      onclick="stopScanner()">

      หยุดกล้อง

    </button>


    <!-- CAMERA -->
    <div id="reader"></div>


    <!-- RESULT -->
    <div
      id="result"
      class="result ready">

      <div class="result-title">
        พร้อมใช้งาน
      </div>

      <div class="result-detail">
        กดเริ่ม QR Scanner
      </div>

    </div>


    <!--
      สำคัญ:
      ปุ่มนี้จะขึ้นหลังตรวจข้อมูลเสร็จ
    -->
    <button
      id="nextButton"
      class="hidden"
      onclick="scanNextPerson()">

      📷 Scan คนต่อไป

    </button>


    <!-- WALK-IN -->
    <button
      id="walkinButton"
      class="warning hidden"
      onclick="confirmWalkIn()">

      อนุญาต Walk-in

    </button>


    <button
      class="secondary"
      onclick="closeScannerWindow()">

      ← กลับ Staff Dashboard

    </button>


    <div class="hint">

      หลัง Scan สำเร็จ กล้องจะ Pause ชั่วคราว
      เพื่อให้ Staff ตรวจชื่อและสถานะก่อน

      <br><br>

      เมื่อพร้อมรับคนถัดไป กด
      <strong>Scan คนต่อไป</strong>
      แล้วกล้องเดิมจะทำงานต่อทันที

    </div>


  </div>


</div>


<!--
  Apps Script POST response
  จะโหลดอยู่ใน iframe นี้

  หน้า Scanner หลักจึงไม่ถูก redirect
-->
<iframe
  id="bridgeFrame"
  name="bridgeFrame"
  style="display:none;">
</iframe>


<script>


/**
 * ============================================================
 * STATE
 * ============================================================
 */

let scanner =
  null;


let running =
  false;


let paused =
  false;


let processing =
  false;


let pendingRequestId =
  '';


let pendingToken =
  '';


let pendingWalkInToken =
  '';


let timeoutId =
  null;


/**
 * ============================================================
 * URL CONFIG
 * ============================================================
 */

const params =
  new URLSearchParams(
    window.location.search
  );


const callbackUrl =
  params.get(
    'callback'
  )
  ||
  '';


const scanSession =
  params.get(
    'session'
  )
  ||
  '';


/**
 * ต้องเข้าจาก Staff Dashboard เท่านั้น
 */
if (
  !callbackUrl ||
  !scanSession
) {

  setResult(
    'error',
    'เปิด Scanner ไม่ถูกวิธี',
    '',
    'กรุณาเปิด QR Scanner จาก Staff Dashboard'
  );


  document
    .getElementById(
      'startButton'
    )
    .disabled =
      true;

}


/**
 * ============================================================
 * START CAMERA
 * ============================================================
 */

async function startScanner() {


  if (
    running
  ) {
    return;
  }


  if (
    !callbackUrl ||
    !scanSession
  ) {
    return;
  }


  try {


    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(


      {
        facingMode:
          'environment'
      },


      {
        fps:
          12,

        qrbox: {

          width:
            260,

          height:
            260

        },

        aspectRatio:
          1

      },


      function(
        decodedText
      ) {

        onQrDetected(
          decodedText
        );

      },


      function() {

        // QR not detected
        // ไม่ต้องทำอะไร

      }


    );


    running =
      true;


    paused =
      false;


    document
      .getElementById(
        'startButton'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'stopButton'
      )
      .classList
      .remove(
        'hidden'
      );


    document
      .getElementById(
        'cameraBadge'
      )
      .classList
      .remove(
        'hidden'
      );


    setResult(
      'ready',
      'พร้อมสแกน',
      '',
      'นำ QR Code มาไว้หน้ากล้อง'
    );


  } catch (error) {


    console.error(
      error
    );


    setResult(
      'error',
      'เปิดกล้องไม่ได้',
      '',
      error.message ||
      String(error)
    );


  }

}


/**
 * ============================================================
 * QR DETECTED
 * ============================================================
 */

async function onQrDetected(
  decodedText
) {


  if (
    processing ||
    paused
  ) {
    return;
  }


  const token =
    String(
      decodedText || ''
    )
    .trim();


  if (!token) {
    return;
  }


  /**
   * ทันทีที่อ่าน QR ได้
   * Pause กล้อง
   *
   * ไม่ Stop camera
   *
   * เพราะ Stop จะทำให้ต้องเปิดใหม่
   */
  pauseCamera();


  submitScan(
    token,
    false
  );

}


/**
 * ============================================================
 * PAUSE CAMERA
 * ============================================================
 */

function pauseCamera() {


  if (
    !scanner ||
    !running ||
    paused
  ) {
    return;
  }


  try {


    if (
      typeof scanner.pause ===
      'function'
    ) {

      /**
       * true =
       * pause video feed ด้วย
       */
      scanner.pause(
        true
      );

    }


    paused =
      true;


  } catch (error) {


    console.log(
      'Pause camera error',
      error
    );


    /**
     * ถึง pause ไม่สำเร็จ
     * processing จะยัง block QR อื่นอยู่
     */
    paused =
      true;

  }

}


/**
 * ============================================================
 * RESUME CAMERA
 * ============================================================
 */

function resumeCamera() {


  if (
    !scanner ||
    !running
  ) {
    return;
  }


  try {


    if (
      typeof scanner.resume ===
      'function'
    ) {

      scanner.resume();

    }


  } catch (error) {


    console.log(
      'Resume camera error',
      error
    );

  }


  paused =
    false;

}


/**
 * ============================================================
 * SUBMIT TO APPS SCRIPT
 * ============================================================
 */

function submitScan(
  token,
  overrideWalkin
) {


  if (
    processing
  ) {
    return;
  }


  processing =
    true;


  pendingToken =
    token;


  pendingWalkInToken =
    '';


  document
    .getElementById(
      'nextButton'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'walkinButton'
    )
    .classList
    .add(
      'hidden'
    );


  setResult(
    'loading',
    'กำลังตรวจสอบ...',
    '',
    'กรุณารอสักครู่'
  );


  const requestId =
    createRequestId();


  pendingRequestId =
    requestId;


  /**
   * สร้าง hidden POST form
   */
  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';


  form.action =
    callbackUrl;


  /**
   * สำคัญมาก:
   *
   * Apps Script โหลดใน iframe
   * ไม่เปลี่ยนหน้า GitHub Scanner
   */
  form.target =
    'bridgeFrame';


  appendHidden(
    form,
    'action',
    'externalScanV2'
  );


  appendHidden(
    form,
    'scanSession',
    scanSession
  );


  appendHidden(
    form,
    'requestId',
    requestId
  );


  appendHidden(
    form,
    'token',
    token
  );


  appendHidden(
    form,
    'overrideWalkin',
    overrideWalkin
      ?
      '1'
      :
      '0'
  );


  document
    .body
    .appendChild(
      form
    );


  form.submit();


  setTimeout(
    function() {

      try {

        form.remove();

      } catch (error) {}

    },
    1000
  );


  /**
   * Backend timeout
   */
  clearTimeout(
    timeoutId
  );


  timeoutId =
    setTimeout(
      function() {


        if (
          processing &&
          pendingRequestId ===
            requestId
        ) {


          processing =
            false;


          pendingRequestId =
            '';


          setResult(
            'error',
            'ระบบตอบกลับช้า',
            '',
            'กรุณาลอง Scan คนนี้อีกครั้ง'
          );


          showNextButton();

        }

      },
      15000
    );

}


/**
 * ============================================================
 * RECEIVE APPS SCRIPT RESULT
 * ============================================================
 */

window.addEventListener(
  'message',

  function(event) {


    /**
     * Apps Script response อาจมาจาก
     * script.google.com /
     * script.googleusercontent.com
     *
     * เราตรวจ payload อีกชั้นแทน
     */
    const data =
      event.data;


    if (
      !data ||
      data.source !==
        'STEAM4_SCAN_RESULT'
    ) {

      return;
    }


    /**
     * ต้องตรงกับ Request ปัจจุบัน
     */
    if (
      !data.requestId ||
      data.requestId !==
        pendingRequestId
    ) {

      return;
    }


    clearTimeout(
      timeoutId
    );


    processing =
      false;


    pendingRequestId =
      '';


    handleBackendResult(
      data.result || {}
    );

  }
);


/**
 * ============================================================
 * BACKEND RESULT
 * ============================================================
 */

function handleBackendResult(
  result
) {


  /**
   * SUCCESS
   */
  if (
    result.ok
  ) {


    let detail =
      result.registrationId
      ||
      '';


    if (
      result.sessionName
    ) {


      detail +=
        (
          detail
            ?
            ' · '
            :
            ''
        )
        +
        result.sessionName;

    }


    setResult(
      'success',

      result.type ===
      'WALK_IN'
        ?
        '✅ WALK-IN SUCCESS'
        :
        '✅ CHECK-IN SUCCESS',

      result.name || '',

      detail
    );


    /**
     * Staff อ่านผลก่อน
     * แล้วค่อยกด Scan คนต่อไป
     */
    showNextButton();


    vibrateSuccess();


    return;

  }


  /**
   * DUPLICATE
   */
  if (
    result.type ===
    'DUPLICATE'
  ) {


    setResult(
      'warning',
      '⚠️ CHECKED-IN แล้ว',
      result.name || '',
      result.message || ''
    );


    showNextButton();


    return;

  }


  /**
   * NOT REGISTERED
   */
  if (
    result.type ===
    'NOT_REGISTERED'
  ) {


    pendingWalkInToken =
      pendingToken;


    setResult(
      'warning',
      '⚠️ ไม่ได้ลงทะเบียน Session นี้',
      result.name || '',
      result.sessionName ||
      result.message ||
      ''
    );


    /**
     * Staff เลือก:
     *
     * Walk-in
     * หรือ
     * Scan คนถัดไป
     */
    if (
      result.canOverride
    ) {

      document
        .getElementById(
          'walkinButton'
        )
        .classList
        .remove(
          'hidden'
        );

    }


    showNextButton();


    return;

  }


  /**
   * ROOM FULL
   */
  if (
    result.type ===
    'SESSION_FULL'
  ) {


    setResult(
      'error',
      '🔴 ห้องเต็ม',
      result.name || '',
      result.message || ''
    );


    showNextButton();


    return;

  }


  /**
   * Scanner Session expired
   */
  if (
    result.type ===
    'SCAN_SESSION_EXPIRED'
  ) {


    setResult(
      'error',
      'Scanner Session หมดอายุ',
      '',
      'กรุณากลับ Staff Dashboard แล้วเปิด Scanner ใหม่'
    );


    return;

  }


  /**
   * Generic error
   */
  setResult(
    'error',
    '❌ ERROR',
    result.name || '',
    result.message ||
    result.type ||
    'เกิดข้อผิดพลาด'
  );


  showNextButton();

}


/**
 * ============================================================
 * SCAN NEXT PERSON
 * ============================================================
 */

function scanNextPerson() {


  /**
   * ซ่อน Result actions
   */
  document
    .getElementById(
      'nextButton'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'walkinButton'
    )
    .classList
    .add(
      'hidden'
    );


  pendingToken =
    '';


  pendingWalkInToken =
    '';


  processing =
    false;


  /**
   * Resume camera เดิม
   *
   * ไม่เปิด camera ใหม่
   * ไม่ขอ permission ใหม่
   */
  resumeCamera();


  setResult(
    'ready',
    'พร้อมสแกนคนต่อไป',
    '',
    'นำ QR Code มาไว้หน้ากล้อง'
  );

}


/**
 * ============================================================
 * WALK-IN
 * ============================================================
 */

function confirmWalkIn() {


  if (
    !pendingWalkInToken
  ) {
    return;
  }


  const token =
    pendingWalkInToken;


  /**
   * ไม่ Resume กล้อง
   *
   * ส่งข้อมูลคนเดิมกลับ Backend
   * ด้วย override
   */
  processing =
    false;


  document
    .getElementById(
      'nextButton'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'walkinButton'
    )
    .classList
    .add(
      'hidden'
    );


  submitScan(
    token,
    true
  );

}


/**
 * ============================================================
 * NEXT BUTTON
 * ============================================================
 */

function showNextButton() {


  document
    .getElementById(
      'nextButton'
    )
    .classList
    .remove(
      'hidden'
    );

}


/**
 * ============================================================
 * STOP CAMERA
 * ============================================================
 */

async function stopScanner() {


  if (
    !scanner ||
    !running
  ) {
    return;
  }


  try {


    await scanner.stop();


  } catch (error) {


    console.log(
      error
    );

  }


  running =
    false;


  paused =
    false;


  processing =
    false;


  document
    .getElementById(
      'cameraBadge'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'stopButton'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'startButton'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'nextButton'
    )
    .classList
    .add(
      'hidden'
    );


  setResult(
    'ready',
    'Scanner หยุดแล้ว',
    '',
    'กดเริ่ม QR Scanner เพื่อใช้งานต่อ'
  );

}


/**
 * ============================================================
 * CLOSE SCANNER
 * ============================================================
 */

async function closeScannerWindow() {


  if (
    scanner &&
    running
  ) {


    try {


      await scanner.stop();


    } catch (error) {}


  }


  /**
   * ไม่ navigate ไป /exec
   *
   * Dashboard เดิมยัง Login อยู่
   */
  try {


    window.close();


  } catch (error) {}


  /**
   * iOS บาง context ไม่ยอม window.close()
   */
  setTimeout(
    function() {


      setResult(
        'ready',
        'กลับ Staff Dashboard',
        '',
        'กด X มุมขวาบนเพื่อกลับ Dashboard'
      );


    },
    400
  );

}


/**
 * ============================================================
 * UI
 * ============================================================
 */

function setResult(
  type,
  title,
  name,
  detail
) {


  const box =
    document
      .getElementById(
        'result'
      );


  box.className =
    'result '
    +
    type;


  box.innerHTML =
    `

      <div class="result-title">
        ${escapeHtml(title)}
      </div>

      ${
        name
          ?
          `
            <div class="result-name">
              ${escapeHtml(name)}
            </div>
          `
          :
          ''
      }

      ${
        detail
          ?
          `
            <div class="result-detail">
              ${escapeHtml(detail)}
            </div>
          `
          :
          ''
      }

    `;

}


/**
 * ============================================================
 * HELPERS
 * ============================================================
 */

function appendHidden(
  form,
  name,
  value
) {


  const input =
    document.createElement(
      'input'
    );


  input.type =
    'hidden';


  input.name =
    name;


  input.value =
    value;


  form.appendChild(
    input
  );

}


function createRequestId() {


  if (
    window.crypto &&
    typeof window.crypto.randomUUID ===
      'function'
  ) {


    return window.crypto
      .randomUUID();

  }


  return (
    Date.now()
    +
    '-'
    +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function vibrateSuccess() {


  if (
    navigator.vibrate
  ) {


    navigator.vibrate(
      100
    );

  }

}


function escapeHtml(
  text
) {


  const div =
    document
      .createElement(
        'div'
      );


  div.textContent =
    text || '';


  return div.innerHTML;

}


</script>


</body>

</html>
