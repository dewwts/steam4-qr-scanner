<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>
    STEAM4 QR Scanner
  </title>


  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        #f3f5f7;

      color:
        #111;
    }


    .app {
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }


    .card {
      background: white;

      border-radius:
        22px;

      padding:
        22px;

      box-shadow:
        0 4px 20px
        rgba(0,0,0,.08);
    }


    h1 {
      margin:
        0 0 6px;

      font-size:
        24px;
    }


    .subtitle {
      color:
        #666;

      font-size:
        14px;

      line-height:
        1.5;
    }


    #reader {
      width:
        100%;

      margin-top:
        20px;

      overflow:
        hidden;

      border-radius:
        18px;
    }


    button {
      width:
        100%;

      min-height:
        52px;

      margin-top:
        16px;

      border:
        0;

      border-radius:
        14px;

      background:
        #111;

      color:
        white;

      font-size:
        17px;

      font-weight:
        700;

      cursor:
        pointer;
    }


    button.secondary {
      background:
        #eee;

      color:
        #111;
    }


    .status {
      margin-top:
        18px;

      padding:
        18px;

      text-align:
        center;

      border-radius:
        16px;

      background:
        #f2f3f4;
    }


    .status.success {
      background:
        #dcf7e2;
    }


    .status.error {
      background:
        #ffe0e0;
    }


    .big {
      font-size:
        22px;

      font-weight:
        750;
    }


    .small {
      margin-top:
        5px;

      color:
        #666;

      font-size:
        13px;

      line-height:
        1.5;
    }


    .token {
      margin-top:
        10px;

      padding:
        10px;

      word-break:
        break-all;

      font-size:
        11px;

      background:
        rgba(0,0,0,.05);

      border-radius:
        8px;
    }


    .hidden {
      display:
        none !important;
    }

  </style>

</head>


<body>


<div class="app">

  <div class="card">


    <h1>
      STEAM4 QR Scanner
    </h1>


    <div class="subtitle">
      ใช้สำหรับ Staff Check-in เท่านั้น
    </div>


    <button
      id="startButton"
      onclick="startScanner()">
      📷 เปิดกล้อง Scan QR
    </button>


    <button
      id="stopButton"
      class="secondary hidden"
      onclick="stopScanner()">
      ปิดกล้อง
    </button>


    <div id="reader"></div>


    <div
      id="status"
      class="status">

      <div class="big">
        พร้อมเปิดกล้อง
      </div>

      <div class="small">
        กรุณากดปุ่มด้านบน
      </div>

    </div>


  </div>

</div>


<script>


let scanner =
  null;


let running =
  false;


let finished =
  false;


/**
 * ============================================================
 * CALLBACK CONFIG
 * ============================================================
 */

const query =
  new URLSearchParams(
    window.location.search
  );


const callbackUrl =
  query.get(
    'callback'
  )
  ||
  '';


const scanTicket =
  query.get(
    'ticket'
  )
  ||
  '';


/**
 * ตรวจว่าเปิดมาจาก Staff App จริง
 */
if (
  !callbackUrl ||
  !scanTicket
) {

  showStatus(
    'error',
    'เปิด Scanner ไม่ถูกวิธี',
    'กรุณาเปิด QR Scanner จากหน้า Staff Check-in'
  );


  document
    .getElementById(
      'startButton'
    )
    .disabled =
      true;

}


/**
 * ============================================================
 * OPEN CAMERA
 * ============================================================
 */
async function startScanner() {


  if (
    running ||
    finished
  ) {
    return;
  }


  if (
    !callbackUrl ||
    !scanTicket
  ) {
    return;
  }


  try {


    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(


      {
        facingMode:
          'environment'
      },


      {
        fps:
          10,

        qrbox: {
          width:
            260,
          height:
            260
        },

        aspectRatio:
          1
      },


      function(
        decodedText
      ) {

        handleScan(
          decodedText
        );

      },


      function() {

        /**
         * ignore QR miss
         */

      }


    );


    running =
      true;


    document
      .getElementById(
        'startButton'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'stopButton'
      )
      .classList
      .remove(
        'hidden'
      );


    showStatus(
      '',
      'กำลังสแกน...',
      'หันกล้องไปที่ QR Code'
    );


  } catch (error) {


    console.error(
      error
    );


    showStatus(
      'error',
      'เปิดกล้องไม่ได้',
      error.message ||
      String(error)
    );


  }

}


/**
 * ============================================================
 * QR SUCCESS
 * ============================================================
 */
async function handleScan(
  decodedText
) {


  if (finished) {
    return;
  }


  finished =
    true;


  const token =
    String(
      decodedText || ''
    )
    .trim();


  if (!token) {

    finished =
      false;

    return;
  }


  /**
   * หยุดกล้อง
   */
  try {

    if (
      scanner &&
      running
    ) {

      await scanner.stop();

    }

  } catch (error) {

    console.log(
      error
    );

  }


  running =
    false;


  document
    .getElementById(
      'stopButton'
    )
    .classList
    .add(
      'hidden'
    );


  showStatus(
    'success',
    '✅ Scan สำเร็จ',
    'กำลังตรวจสอบข้อมูลกับระบบ...',
    token
  );


  /**
   * ==========================================================
   * IMPORTANT
   *
   * ไม่ใช้:
   * window.opener
   * postMessage
   *
   * ส่ง QR กลับ Apps Script ด้วย POST
   * ==========================================================
   */

  setTimeout(
    function() {

      submitToAppsScript(
        token
      );

    },
    400
  );

}


/**
 * ============================================================
 * POST TO APPS SCRIPT
 * ============================================================
 */
function submitToAppsScript(
  token
) {


  const form =
    document.createElement(
      'form'
    );


  form.method =
    'POST';


  form.action =
    callbackUrl;


  form.target =
    '_self';


  /**
   * action
   */
  appendHidden(
    form,
    'action',
    'externalScan'
  );


  /**
   * one-time ticket
   */
  appendHidden(
    form,
    'ticket',
    scanTicket
  );


  /**
   * QR Token
   */
  appendHidden(
    form,
    'token',
    token
  );


  document
    .body
    .appendChild(
      form
    );


  form.submit();

}


/**
 * Hidden form field helper
 */
function appendHidden(
  form,
  name,
  value
) {


  const input =
    document.createElement(
      'input'
    );


  input.type =
    'hidden';


  input.name =
    name;


  input.value =
    value;


  form.appendChild(
    input
  );

}


/**
 * ============================================================
 * STOP CAMERA
 * ============================================================
 */
async function stopScanner() {


  if (
    !scanner ||
    !running
  ) {
    return;
  }


  try {

    await scanner.stop();

  } catch (error) {

    console.log(
      error
    );

  }


  running =
    false;


  document
    .getElementById(
      'startButton'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'stopButton'
    )
    .classList
    .add(
      'hidden'
    );

}


/**
 * ============================================================
 * STATUS
 * ============================================================
 */
function showStatus(
  type,
  title,
  subtitle,
  token
) {


  const box =
    document
      .getElementById(
        'status'
      );


  box.className =
    'status'
    +
    (
      type
        ?
        ' ' +
        type
        :
        ''
    );


  box.innerHTML =
    `

      <div class="big">
        ${escapeHtml(title)}
      </div>

      <div class="small">
        ${escapeHtml(subtitle)}
      </div>

      ${
        token
          ?
          `
            <div class="token">
              ${escapeHtml(token)}
            </div>
          `
          :
          ''
      }

    `;

}


/**
 * ============================================================
 * ESCAPE
 * ============================================================
 */
function escapeHtml(
  text
) {


  const div =
    document.createElement(
      'div'
    );


  div.textContent =
    text || '';


  return div.innerHTML;

}


</script>


</body>

</html>
