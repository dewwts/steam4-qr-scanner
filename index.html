<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>STEAM4 QR Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f3f5f7;
      color: #111;
    }

    .app {
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 18px;
    }

    button {
      width: 100%;
      min-height: 52px;
      margin-top: 16px;
      border: 0;
      border-radius: 14px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #eee;
      color: #111;
    }

    .status {
      margin-top: 18px;
      padding: 18px;
      text-align: center;
      border-radius: 16px;
      background: #f2f3f4;
    }

    .status.success {
      background: #dcf7e2;
    }

    .status.error {
      background: #ffe0e0;
    }

    .big {
      font-size: 22px;
      font-weight: 750;
    }

    .small {
      margin-top: 5px;
      color: #666;
      font-size: 13px;
    }

    .token {
      margin-top: 10px;
      padding: 10px;
      word-break: break-all;
      font-size: 11px;
      background: rgba(0,0,0,.05);
      border-radius: 8px;
    }

    .hidden {
      display: none !important;
    }

  </style>
</head>

<body>

<div class="app">

  <div class="card">

    <h1>
      STEAM4 QR Scanner
    </h1>

    <div class="subtitle">
      ใช้สำหรับ Staff Check-in เท่านั้น
    </div>

    <button
      id="startButton"
      onclick="startScanner()">
      📷 เปิดกล้อง Scan QR
    </button>

    <button
      id="stopButton"
      class="secondary hidden"
      onclick="stopScanner()">
      ปิดกล้อง
    </button>

    <div id="reader"></div>

    <div
      id="status"
      class="status">

      <div class="big">
        พร้อมเปิดกล้อง
      </div>

      <div class="small">
        กรุณากดปุ่มด้านบน
      </div>

    </div>

    <button
      id="returnButton"
      class="secondary hidden"
      onclick="returnToCheckin()">
      ← กลับหน้า Check-in
    </button>

  </div>

</div>


<script>

let scanner = null;
let running = false;
let finished = false;


/**
 * เปิดกล้อง
 */
async function startScanner() {

  if (running) {
    return;
  }

  finished = false;

  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );

    await scanner.start(

  {
    facingMode: "environment"
  },

  {
    fps: 10,

    qrbox: {
      width: 260,
      height: 260
    },

    aspectRatio: 1
  },

  function(decodedText) {

    handleScan(
      decodedText
    );

  },

  function() {
    // ไม่ต้องทำอะไรตอนอ่าน QR ไม่เจอ
  }

);

    running = true;

    document
      .getElementById(
        'startButton'
      )
      .classList
      .add('hidden');

    document
      .getElementById(
        'stopButton'
      )
      .classList
      .remove('hidden');

    showStatus(
      '',
      'กำลังสแกน...',
      'หันกล้องไปที่ QR Code'
    );

  } catch (error) {

    console.error(error);

    showStatus(
      'error',
      'เปิดกล้องไม่ได้',
      error.message || String(error)
    );

  }

}


/**
 * เมื่ออ่าน QR สำเร็จ
 */
async function handleScan(
  decodedText
) {

  if (finished) {
    return;
  }

  finished = true;

  const token =
    String(
      decodedText || ''
    ).trim();

  if (!token) {

    finished = false;

    return;

  }

  try {

    if (
      scanner &&
      running
    ) {

      await scanner.stop();

    }

  } catch (error) {

    console.log(error);

  }

  running = false;


  showStatus(
    'success',
    '✅ Scan สำเร็จ',
    'กำลังส่งข้อมูลกลับระบบ...',
    token
  );


  /**
   * ส่ง QR Token กลับ Apps Script
   *
   * Google แนะนำ pattern:
   * external page → window.opener.postMessage()
   */
  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(
      {
        source:
          'STEAM4_EXTERNAL_SCANNER',

        type:
          'QR_SCAN',

        token:
          token
      },

      '*'
    );


    /**
     * เว้นเวลานิดเดียว
     * ก่อนปิดหน้า Scanner
     */
    setTimeout(
      function() {

        try {

          window.close();

        } catch (error) {

          console.log(error);

        }

      },
      500
    );


    /**
     * ถ้า Safari ไม่ปิด tab ให้เอง
     * แสดงปุ่มกลับ
     */
    setTimeout(
      function() {

        document
          .getElementById(
            'returnButton'
          )
          .classList
          .remove('hidden');

      },
      1200
    );

  } else {

    /**
     * fallback
     * กรณี browser ทำ window.opener หาย
     */
    showStatus(
      'success',
      '✅ Scan สำเร็จ',
      'กลับไปหน้า Check-in แล้วลองอีกครั้งหากระบบไม่รับข้อมูล',
      token
    );

  }

}


/**
 * ปิดกล้อง
 */
async function stopScanner() {

  if (
    !scanner ||
    !running
  ) {
    return;
  }

  try {

    await scanner.stop();

  } catch (error) {

    console.log(error);

  }

  running = false;

  document
    .getElementById(
      'startButton'
    )
    .classList
    .remove('hidden');

  document
    .getElementById(
      'stopButton'
    )
    .classList
    .add('hidden');

}


/**
 * กลับหน้าเดิม
 */
function returnToCheckin() {

  try {

    window.close();

  } catch (error) {

    history.back();

  }

}


function showStatus(
  type,
  title,
  subtitle,
  token
) {

  const box =
    document
      .getElementById(
        'status'
      );

  box.className =
    'status'
    +
    (
      type
        ? ' ' + type
        : ''
    );

  box.innerHTML =
    `
      <div class="big">
        ${escapeHtml(title)}
      </div>

      <div class="small">
        ${escapeHtml(subtitle)}
      </div>

      ${
        token
          ?
          `
            <div class="token">
              ${escapeHtml(token)}
            </div>
          `
          :
          ''
      }
    `;

}


function escapeHtml(text) {

  const div =
    document.createElement(
      'div'
    );

  div.textContent =
    text || '';

  return div.innerHTML;

}

</script>

</body>

</html>
